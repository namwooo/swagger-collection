openapi: 3.0.3
info:
  title: MRX Interface API
  version: 1.0.0
  description: |
    MRX 시스템 간 인터페이스 정의서 (Storage / Labeling / Training)

    - 모든 요청 메시지는 공통 `header`(msg_id, send_time)와 업무 데이터 `body`로 구성됩니다.
    - 모든 응답은 공통 수신 응답(`AckResponse`)을 반환합니다.
    - 인터페이스 ID 규칙: `if-s**`(Storage), `if-l**`(Labeling/Dataset), `if-t**`(Training)

servers:
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: Storage
    description: 이미지 저장/업로드 (if-s)
  - name: Labeling
    description: 데이터셋 구성 및 라벨링 (if-l)
  - name: Training
    description: 모델 학습 (if-t)

paths:
  # ───────────────────────── Storage ─────────────────────────
  /images/save-callback:
    post:
      tags: [Storage]
      operationId: ifS01ImageSaveCallback
      summary: "[if-s01] 이미지 저장 callback"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/ImageSaveCallback'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /images/upload:
    post:
      tags: [Storage]
      operationId: ifS02ImageUpload
      summary: "[if-s02] 이미지 업로드"
      description: |
        이미지 파일 업로드. multipart/form-data로 전송합니다.
        ※ 원본 정의서에 job_id 외 항목이 "...."로 미정 상태이므로 추가 필드 확정 필요.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [msg_id, send_time, job_id, file]
              properties:
                msg_id:
                  type: string
                  description: 메시지 ID
                send_time:
                  type: string
                  format: date-time
                  description: 송신 시각
                job_id:
                  type: string
                  description: 작업 ID
                file:
                  type: string
                  format: binary
                  description: 업로드 이미지 파일
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────── Labeling ─────────────────────────
  /datasets/build:
    post:
      tags: [Labeling]
      operationId: ifL01DatasetBuildRequest
      summary: "[if-l01] 데이터셋 구성 지시"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/DatasetBuildRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /labels/result-callback:
    post:
      tags: [Labeling]
      operationId: ifL02LabelResultCallback
      summary: "[if-l02] 라벨링 결과 수신 callback"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/LabelResultCallback'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /datasets/build-complete-callback:
    post:
      tags: [Labeling]
      operationId: ifL03DatasetBuildCompleteCallback
      summary: "[if-l03] 데이터셋 구성 완료 통보 callback"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/DatasetBuildCompleteCallback'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /labels/review-result:
    post:
      tags: [Labeling]
      operationId: ifL04ReviewResult
      summary: "[if-l04] 검수 판정 회신"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/ReviewResult'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  # ───────────────────────── Training ─────────────────────────
  /trainings:
    post:
      tags: [Training]
      operationId: ifT01TrainingRequest
      summary: "[if-t01] 학습 작업 지시"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/TrainingRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /trainings/progress-callback:
    post:
      tags: [Training]
      operationId: ifT02TrainingProgressCallback
      summary: "[if-t02] 학습 진행 상태 callback"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/TrainingProgressCallback'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /trainings/evaluation-callback:
    post:
      tags: [Training]
      operationId: ifT03TrainingEvaluationCallback
      summary: "[if-t03] 학습 평가 결과 callback"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/TrainingEvaluationCallback'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /trainings/cancel:
    post:
      tags: [Training]
      operationId: ifT05TrainingCancel
      summary: "[if-t05] 학습 취소"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [header, body]
              properties:
                header:
                  $ref: '#/components/schemas/Header'
                body:
                  $ref: '#/components/schemas/TrainingCancel'
      responses:
        '200':
          $ref: '#/components/responses/Ack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  responses:
    Ack:
      description: 정상 수신
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AckResponse'
    BadRequest:
      description: 요청 형식 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AckResponse'
          example:
            header: { msg_id: "MSG-20261118-0001", send_time: "2026-11-18T09:00:00+09:00" }
            result_cd: "E400"
            result_msg: "필수 항목 누락: dataset_id"
    ServerError:
      description: 서버 처리 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AckResponse'

  schemas:
    # ───────── 공통 ─────────
    Header:
      type: object
      description: 공통 메시지 헤더
      required: [msg_id, send_time]
      properties:
        msg_id:
          type: string
          description: 메시지 고유 ID
          example: MSG-20261118-0001
        send_time:
          type: string
          format: date-time
          description: 송신 시각 (ISO 8601)
          example: "2026-11-18T09:00:00+09:00"

    AckResponse:
      type: object
      description: 공통 수신 응답
      required: [header, result_cd]
      properties:
        header:
          $ref: '#/components/schemas/Header'
        result_cd:
          type: string
          description: 처리 결과 코드 (0000 = 정상)
          example: "0000"
        result_msg:
          type: string
          description: 처리 결과 메시지
          example: OK

    ResultCode:
      type: string
      description: 처리 결과
      enum: [SUCCESS, FAIL]

    Label:
      type: object
      description: 라벨 정보
      required: [class_cd, region]
      properties:
        class_cd:
          type: string
          description: 클래스 코드
          example: SCRATCH
        region:
          $ref: '#/components/schemas/Region'

    Region:
      type: object
      description: 라벨 영역
      required: [type, points]
      properties:
        type:
          type: string
          enum: [bbox, polygon]
          description: 영역 유형
        points:
          type: array
          description: |
            좌표 목록 (px).
            bbox: [x_min, y_min, x_max, y_max], polygon: [x1, y1, x2, y2, ...]
          items:
            type: number
          example: [120, 80, 260, 190]

    # ───────── Storage ─────────
    ImageSaveCallback:
      type: object
      description: "[if-s01] 이미지 저장 callback"
      required: [inspection_id, path]
      properties:
        inspection_id:
          type: string
          description: 검사 ID
          example: INS-000123
        path:
          type: string
          description: 저장 경로
          example: /data/images/2026/11/18/INS-000123.png

    # ───────── Labeling ─────────
    DatasetBuildRequest:
      type: object
      description: "[if-l01] 데이터셋 구성 지시"
      required: [job_id, dataset_id, dataset_no]
      properties:
        job_id:
          type: string
          description: 작업 ID
          example: JOB-0001
        group_id:
          type: string
          description: 그룹 ID
        ppid:
          type: string
          description: PPID
        position_id:
          type: string
          description: 위치 ID
        dataset_id:
          type: string
          description: 데이터셋 ID
          example: DS-0001
        dataset_no:
          type: integer
          description: 데이터셋 번호(버전)
          example: 2
        base_dataset_id:
          type: string
          nullable: true
          description: 기준 데이터셋 ID
        base_dataset_no:
          type: integer
          nullable: true
          description: 기준 데이터셋 번호
        target_ok_cnt:
          type: integer
          minimum: 0
          description: 목표 OK 수량
          example: 1000
        target_ng_cnt:
          type: integer
          minimum: 0
          description: 목표 NG 수량
          example: 500
        class_list:
          type: array
          description: 클래스 목록
          items:
            type: string
          example: [SCRATCH, DENT, STAIN]
        pool_list:
          type: array
          description: 이미지 풀 목록
          items:
            type: string
        label_list:
          type: array
          description: 라벨 목록
          items:
            type: string

    LabelResultCallback:
      type: object
      description: "[if-l02] 라벨링 결과 수신 callback"
      required: [inspection_id, labels]
      properties:
        inspection_id:
          type: string
          description: 검사 ID
        labels:
          type: array
          description: 라벨 목록
          items:
            $ref: '#/components/schemas/Label'
        review_yn:
          type: string
          enum: [Y, N]
          description: 검수 필요 여부

    ClassStat:
      type: object
      description: 클래스별 통계
      properties:
        class_cd:
          type: string
          description: 클래스 코드
        total_cnt:
          type: integer
        train_cnt:
          type: integer
        val_cnt:
          type: integer
        test_cnt:
          type: integer

    DatasetBuildCompleteCallback:
      type: object
      description: "[if-l03] 데이터셋 구성 완료 통보 callback"
      required: [dataset_id, dataset_no, result]
      properties:
        dataset_id:
          type: string
          description: 데이터셋 ID
        dataset_no:
          type: integer
          description: 데이터셋 번호
        result:
          $ref: '#/components/schemas/ResultCode'
        total_cnt:
          type: integer
          description: 전체 수량
        train_cnt:
          type: integer
          description: 학습(train) 수량
        val_cnt:
          type: integer
          description: 검증(val) 수량
        test_cnt:
          type: integer
          description: 테스트(test) 수량
        fail_reason:
          type: string
          nullable: true
          description: 실패 사유 (result=FAIL 시)
        class_stat:
          type: array
          description: 클래스별 통계
          items:
            $ref: '#/components/schemas/ClassStat'

    ReviewItem:
      type: object
      required: [inspection_id, job_id, result]
      properties:
        inspection_id:
          type: string
          description: 검사 ID
        job_id:
          type: string
          description: 작업 ID
        result:
          type: string
          description: 검수 판정 결과
          enum: [APPROVE, REJECT]
        labels:
          type: array
          description: 확정(수정) 라벨 목록
          items:
            $ref: '#/components/schemas/Label'

    ReviewResult:
      type: object
      description: "[if-l04] 검수 판정 회신"
      required: [review_list]
      properties:
        review_list:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'

    # ───────── Training ─────────
    TrainingRequest:
      type: object
      description: "[if-t01] 학습 작업 지시"
      required: [run_id, dataset_id, dataset_no, model_id, model_version]
      properties:
        run_id:
          type: string
          description: 학습 실행 ID
          example: RUN-0001
        dataset_id:
          type: string
          description: 데이터셋 ID
        dataset_no:
          type: integer
          description: 데이터셋 번호
        model_id:
          type: string
          description: 모델 ID
        model_version:
          type: string
          description: 모델 버전
          example: "1.2.0"
        base_model_id:
          type: string
          nullable: true
          description: 기준(사전학습) 모델 ID
        base_model_version:
          type: string
          nullable: true
          description: 기준 모델 버전

    Metrics:
      type: object
      description: 지표 (key-value, 예 loss / mAP / precision / recall)
      additionalProperties:
        type: number
      example:
        loss: 0.231
        precision: 0.94
        recall: 0.91
        mAP50: 0.93

    TrainingProgressCallback:
      type: object
      description: "[if-t02] 학습 진행 상태 callback"
      required: [run_id, status]
      properties:
        run_id:
          type: string
          description: 학습 실행 ID
        status:
          type: string
          description: 학습 상태
          enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELED]
        epoch_cur:
          type: integer
          description: 현재 epoch
          example: 12
        epoch_total:
          type: integer
          description: 전체 epoch
          example: 100
        metrics:
          $ref: '#/components/schemas/Metrics'
        log_path:
          type: string
          description: 학습 로그 경로
        fail_reason:
          type: string
          nullable: true
          description: 실패 사유 (status=FAILED 시)

    TrainingEvaluationCallback:
      type: object
      description: "[if-t03] 학습 평가 결과 callback"
      required: [run_id, model_id, model_version]
      properties:
        run_id:
          type: string
          description: 학습 실행 ID
        model_id:
          type: string
          description: 모델 ID
        model_version:
          type: string
          description: 모델 버전
        final_metrics:
          $ref: '#/components/schemas/Metrics'
        confusion_matrix:
          type: array
          description: 혼동 행렬 (행=실제, 열=예측, class_list 순서)
          items:
            type: array
            items:
              type: integer
          example: [[95, 5], [3, 97]]
        registry_path:
          type: string
          description: 모델 레지스트리 경로
        file_hash:
          type: string
          description: 모델 파일 해시 (예 SHA-256)
        framework:
          type: string
          description: 학습 프레임워크
          example: pytorch

    TrainingCancel:
      type: object
      description: "[if-t05] 학습 취소"
      required: [run_id]
      properties:
        run_id:
          type: string
          description: 학습 실행 ID
        reason:
          type: string
          description: 취소 사유