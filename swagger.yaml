---
swagger: "2.0"
info:
  title: "MRX ML Pipeline API"
  version: "0.5.0"
  description: |
    자동 라벨링 → 데이터셋 → 학습 → 모델 승인으로 이어지는 액티브 러닝 파이프라인 API.

    ## 비동기 작업
    라벨링, 데이터셋 생성, 학습은 오래 걸리는 작업이다. 요청하면 바로 `202 Accepted`와 함께
    `queued` 상태의 리소스를 돌려주고, 실제 처리는 워커가 한다.
    끝나면 이벤트(Webhook)로 알리며, 상태는 언제든 조회 API로 확인할 수 있다.

    상태: `queued` → `running` → `succeeded` | `failed` | `canceled`

    ## 이벤트 (Webhook)
    `POST /webhooks`로 구독을 등록하면, 서버가 등록된 URL로 아래 이벤트를 POST한다.
    본문 형식은 `Event` 정의(CloudEvents 형식)를 따른다.
    Swagger 2.0에는 Webhook을 기술하는 문법이 없어서, 이벤트는 여기와 `definitions`에 적는다.

    | 이벤트 | 발생 시점 | data 정의 |
    |---|---|---|
    | `labeling.succeeded` | 자동 라벨링 완료 | `LabelingEventData` |
    | `labeling.failed` | 자동 라벨링 실패 | `LabelingEventData` |
    | `dataset.ready` | 데이터셋 구성 완료 | `DatasetEventData` |
    | `training.succeeded` | 학습 완료 | `TrainingEventData` |
    | `training.failed` | 학습 실패 | `TrainingEventData` |
    | `model.approved` | 모델 승인 | `ModelEventData` |

    - 헤더: `webhook-id`, `webhook-timestamp`(Unix 초), `webhook-signature`(HMAC-SHA256)
    - 받는 쪽은 10초 안에 2xx로 응답해야 한다. 실패하면 1분, 5분, 30분, 2시간 간격으로 재시도한다.
    - 같은 이벤트가 두 번 이상 올 수 있다. 받는 쪽은 `id`로 중복을 거른다.
    - 도착 순서는 보장하지 않는다. 의심스러우면 조회 API로 현재 상태를 확인한다.

    ## 에러
    모든 에러는 RFC 9457 Problem Details 형식(`Problem`)으로 응답한다.
basePath: "/v1"
schemes:
- "http"
consumes:
- "application/json"
produces:
- "application/json"
tags:
- name: "labelings"
  description: "자동 라벨링"
- name: "datasets"
  description: "라벨링 결과로 학습용 데이터셋 구성"
- name: "trainings"
  description: "학습 실행과 모니터링"
- name: "models"
  description: "모델 등록과 승인"
- name: "webhooks"
  description: "이벤트 구독"

paths:
  # ------------------------------------------------------------------ labelings
  /labelings:
    post:
      tags:
      - "labelings"
      summary: "자동 라벨링 실행"
      description: "지정한 모델로 원천 데이터에 자동 라벨링을 시작한다. 끝나면 `labeling.succeeded` 이벤트가 발생한다. (API-LBL-001)"
      operationId: "createLabeling"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/LabelingCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/Labeling"
        "400":
          $ref: "#/responses/BadRequest"
    get:
      tags:
      - "labelings"
      summary: "라벨링 목록 조회"
      description: "최근에 등록한 것부터 보여준다. (API-LBL-002)"
      operationId: "listLabelings"
      parameters:
      - $ref: "#/parameters/status"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "라벨링 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Labeling"
  /labelings/{labeling_id}:
    get:
      tags:
      - "labelings"
      summary: "라벨링 상태 조회"
      description: "진행률, 상태, 결과 요약을 조회한다. 이벤트를 놓쳤을 때 상태를 다시 맞추는 용도로도 쓴다. (API-LBL-003)"
      operationId: "getLabeling"
      parameters:
      - $ref: "#/parameters/labeling_id"
      responses:
        "200":
          description: "라벨링"
          schema:
            $ref: "#/definitions/Labeling"
        "404":
          $ref: "#/responses/NotFound"
  /labelings/{labeling_id}/cancel:
    post:
      tags:
      - "labelings"
      summary: "라벨링 중단"
      description: "대기 중이거나 진행 중인 라벨링을 중단한다. (API-LBL-005)"
      operationId: "cancelLabeling"
      parameters:
      - $ref: "#/parameters/labeling_id"
      responses:
        "200":
          description: "중단됨. 상태는 `canceled`."
          schema:
            $ref: "#/definitions/Labeling"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/AlreadyFinished"

  # ------------------------------------------------------------------ datasets
  /datasets:
    post:
      tags:
      - "datasets"
      summary: "데이터셋 생성"
      description: "라벨링 결과 중 신뢰도 기준 이상인 라벨로 데이터셋을 구성한다. 끝나면 `dataset.ready` 이벤트가 발생한다. 한 번 만든 데이터셋은 수정하지 않는다. (API-DS-003)"
      operationId: "createDataset"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/DatasetCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/Dataset"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "지정한 라벨링 또는 기반 데이터셋이 없음"
          schema:
            $ref: "#/definitions/Problem"
        "409":
          description: "라벨링이 아직 끝나지 않음"
          schema:
            $ref: "#/definitions/Problem"
    get:
      tags:
      - "datasets"
      summary: "데이터셋 목록 조회"
      description: "(API-DS-001)"
      operationId: "listDatasets"
      parameters:
      - name: "labeling_id"
        in: "query"
        description: "이 라벨링에서 만들어진 데이터셋만 조회"
        required: false
        type: "string"
      - $ref: "#/parameters/status"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "데이터셋 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Dataset"
  /datasets/{dataset_id}:
    get:
      tags:
      - "datasets"
      summary: "데이터셋 상세 조회"
      description: "샘플 수, 클래스 분포, 출처 라벨링을 조회한다. (API-DS-002)"
      operationId: "getDataset"
      parameters:
      - $ref: "#/parameters/dataset_id"
      responses:
        "200":
          description: "데이터셋"
          schema:
            $ref: "#/definitions/Dataset"
        "404":
          $ref: "#/responses/NotFound"

  # ------------------------------------------------------------------ trainings
  /trainings:
    post:
      tags:
      - "trainings"
      summary: "학습 실행"
      description: "데이터셋으로 학습을 시작한다. 끝나면 `training.succeeded` 또는 `training.failed` 이벤트가 발생한다. (API-TRN-001)"
      operationId: "createTraining"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/TrainingCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/Training"
        "400":
          $ref: "#/responses/BadRequest"
        "409":
          description: "요청한 GPU를 할당할 수 없음"
          schema:
            $ref: "#/definitions/Problem"
    get:
      tags:
      - "trainings"
      summary: "학습 목록 조회"
      description: "(API-TRN-002)"
      operationId: "listTrainings"
      parameters:
      - name: "dataset_id"
        in: "query"
        description: "이 데이터셋으로 실행한 학습만 조회"
        required: false
        type: "string"
      - $ref: "#/parameters/status"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "학습 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Training"
  /trainings/{training_id}:
    get:
      tags:
      - "trainings"
      summary: "학습 상태 조회"
      description: "진행률과 상태를 조회한다. (API-TRN-003)"
      operationId: "getTraining"
      parameters:
      - $ref: "#/parameters/training_id"
      responses:
        "200":
          description: "학습"
          schema:
            $ref: "#/definitions/Training"
        "404":
          $ref: "#/responses/NotFound"
  /trainings/{training_id}/metrics:
    get:
      tags:
      - "trainings"
      summary: "학습 지표 조회"
      description: "epoch별 지표 이력을 조회한다. 진행 중에도 조회할 수 있다. (API-TRN-004)"
      operationId: "listTrainingMetrics"
      parameters:
      - $ref: "#/parameters/training_id"
      - name: "since_step"
        in: "query"
        description: "이 step 이후의 지표만 조회"
        required: false
        type: "integer"
        minimum: 0
      responses:
        "200":
          description: "지표 이력"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/MetricPoint"
        "404":
          $ref: "#/responses/NotFound"
  /trainings/{training_id}/result:
    get:
      tags:
      - "trainings"
      summary: "학습 결과 조회"
      description: "학습 종료 후 최종 평가 결과를 조회한다. (API-TRN-005)"
      operationId: "getTrainingResult"
      parameters:
      - $ref: "#/parameters/training_id"
      responses:
        "200":
          description: "최종 평가 결과"
          schema:
            $ref: "#/definitions/TrainingResult"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          description: "학습이 아직 끝나지 않음"
          schema:
            $ref: "#/definitions/Problem"
  /trainings/{training_id}/logs:
    get:
      tags:
      - "trainings"
      summary: "학습 로그 조회"
      description: "학습 로그를 조회한다. `follow=true`면 연결을 유지하며 새 로그를 이어서 보낸다. (API-TRN-006)"
      operationId: "getTrainingLogs"
      produces:
      - "text/plain"
      parameters:
      - $ref: "#/parameters/training_id"
      - name: "tail"
        in: "query"
        description: "마지막 N줄만 조회"
        required: false
        type: "integer"
        minimum: 1
      - name: "follow"
        in: "query"
        description: "새 로그를 계속 이어서 받을지 여부"
        required: false
        type: "boolean"
        default: false
      responses:
        "200":
          description: "로그 (한 줄에 한 항목)"
          schema:
            type: "string"
        "404":
          $ref: "#/responses/NotFound"
  /trainings/{training_id}/cancel:
    post:
      tags:
      - "trainings"
      summary: "학습 중단"
      description: "진행 중인 학습을 중단하고 GPU를 반환한다. (API-TRN-007)"
      operationId: "cancelTraining"
      parameters:
      - $ref: "#/parameters/training_id"
      responses:
        "200":
          description: "중단됨. 상태는 `canceled`."
          schema:
            $ref: "#/definitions/Training"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/AlreadyFinished"

  # ------------------------------------------------------------------ models
  /registry/models:
    post:
      tags:
      - "models"
      summary: "모델 등록"
      description: "학습 결과를 모델로 등록한다. 등록 직후 상태는 `pending`(승인대기). (API-MDL-001)"
      operationId: "createModel"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/ModelCreate"
      responses:
        "201":
          description: "등록됨"
          schema:
            $ref: "#/definitions/Model"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "지정한 학습이 없음"
          schema:
            $ref: "#/definitions/Problem"
        "409":
          description: "학습이 성공하지 않았거나 이미 등록됨"
          schema:
            $ref: "#/definitions/Problem"
  /registry/models/{model_id}:
    get:
      tags:
      - "models"
      summary: "모델 상세 조회"
      description: "모델 정보, 출처 학습, 승인 상태를 조회한다. (API-MDL-002)"
      operationId: "getModel"
      parameters:
      - $ref: "#/parameters/model_id"
      responses:
        "200":
          description: "모델"
          schema:
            $ref: "#/definitions/Model"
        "404":
          $ref: "#/responses/NotFound"
  /registry/models/{model_id}/approve:
    post:
      tags:
      - "models"
      summary: "모델 승인"
      description: "등록된 모델을 승인한다. 승인자와 사유를 기록하고 `model.approved` 이벤트가 발생한다. 승인된 모델은 다음 회차 라벨링에 쓸 수 있다. (API-MDL-003)"
      operationId: "approveModel"
      parameters:
      - $ref: "#/parameters/model_id"
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/ModelApprove"
      responses:
        "200":
          description: "승인됨"
          schema:
            $ref: "#/definitions/Model"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          description: "이미 승인된 모델"
          schema:
            $ref: "#/definitions/Problem"

  # ------------------------------------------------------------------ webhooks
  /webhooks:
    post:
      tags:
      - "webhooks"
      summary: "이벤트 구독 등록"
      description: "수신 URL과 받을 이벤트 종류를 등록한다. 응답에 서명 확인용 비밀키(`secret`)가 한 번만 포함된다. (API-WHK-001)"
      operationId: "createWebhook"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/WebhookCreate"
      responses:
        "201":
          description: "등록됨"
          schema:
            $ref: "#/definitions/WebhookCreated"
        "400":
          $ref: "#/responses/BadRequest"
    get:
      tags:
      - "webhooks"
      summary: "이벤트 구독 목록 조회"
      description: "(API-WHK-002)"
      operationId: "listWebhooks"
      responses:
        "200":
          description: "구독 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Webhook"
  /webhooks/{webhook_id}:
    get:
      tags:
      - "webhooks"
      summary: "이벤트 구독 상세 조회"
      description: "(API-WHK-003)"
      operationId: "getWebhook"
      parameters:
      - $ref: "#/parameters/webhook_id"
      responses:
        "200":
          description: "구독"
          schema:
            $ref: "#/definitions/Webhook"
        "404":
          $ref: "#/responses/NotFound"
    patch:
      tags:
      - "webhooks"
      summary: "이벤트 구독 변경"
      description: "수신 URL이나 받을 이벤트 종류를 변경한다. 바꿀 항목만 보낸다. (API-WHK-004)"
      operationId: "updateWebhook"
      parameters:
      - $ref: "#/parameters/webhook_id"
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/WebhookUpdate"
      responses:
        "200":
          description: "변경됨"
          schema:
            $ref: "#/definitions/Webhook"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          $ref: "#/responses/NotFound"
    delete:
      tags:
      - "webhooks"
      summary: "이벤트 구독 해지"
      description: "(API-WHK-005)"
      operationId: "deleteWebhook"
      parameters:
      - $ref: "#/parameters/webhook_id"
      responses:
        "204":
          description: "해지됨"
        "404":
          $ref: "#/responses/NotFound"

parameters:
  labeling_id:
    name: "labeling_id"
    in: "path"
    required: true
    type: "string"
    description: "라벨링 ID"
  dataset_id:
    name: "dataset_id"
    in: "path"
    required: true
    type: "string"
    description: "데이터셋 ID"
  training_id:
    name: "training_id"
    in: "path"
    required: true
    type: "string"
    description: "학습 ID"
  model_id:
    name: "model_id"
    in: "path"
    required: true
    type: "string"
    description: "모델 ID"
  webhook_id:
    name: "webhook_id"
    in: "path"
    required: true
    type: "string"
    description: "구독 ID"
  status:
    name: "status"
    in: "query"
    required: false
    type: "string"
    enum:
    - "queued"
    - "running"
    - "succeeded"
    - "failed"
    - "canceled"
    description: "이 상태인 것만 조회"
  limit:
    name: "limit"
    in: "query"
    required: false
    type: "integer"
    minimum: 1
    maximum: 500
    default: 50
    description: "한 번에 받을 개수"
  offset:
    name: "offset"
    in: "query"
    required: false
    type: "integer"
    minimum: 0
    default: 0
    description: "건너뛸 개수"

responses:
  BadRequest:
    description: "요청 형식 오류"
    schema:
      $ref: "#/definitions/Problem"
  NotFound:
    description: "리소스가 없음"
    schema:
      $ref: "#/definitions/Problem"
  AlreadyFinished:
    description: "이미 끝난 작업이라 중단할 수 없음"
    schema:
      $ref: "#/definitions/Problem"

definitions:
  # ------------------------------------------------------------------ 공통
  JobStatus:
    type: "string"
    description: "비동기 작업 상태"
    enum:
    - "queued"
    - "running"
    - "succeeded"
    - "failed"
    - "canceled"
  Progress:
    type: "object"
    properties:
      done:
        type: "integer"
        description: "처리한 수 (라벨링·데이터셋은 이미지 수, 학습은 epoch 수)"
        example: 1200
      total:
        type: "integer"
        description: "전체 수"
        example: 5000
      percent:
        type: "number"
        example: 24.0
  JobTimes:
    type: "object"
    required:
    - "created_at"
    properties:
      created_at:
        type: "string"
        format: "date-time"
        readOnly: true
      started_at:
        type: "string"
        format: "date-time"
        readOnly: true
        description: "실행 시작 시각. 시작 전에는 없음"
      finished_at:
        type: "string"
        format: "date-time"
        readOnly: true
        description: "종료 시각. 종료 전에는 없음"
  Problem:
    type: "object"
    description: "RFC 9457 Problem Details"
    properties:
      type:
        type: "string"
        example: "https://mrx.internal/problems/not-found"
      title:
        type: "string"
        example: "리소스가 없음"
      status:
        type: "integer"
        example: 404
      detail:
        type: "string"
        example: "labeling 'lbl_01HZW9P3' not found"
      instance:
        type: "string"
        example: "/v1/labelings/lbl_01HZW9P3"

  # ------------------------------------------------------------------ labelings
  LabelingParams:
    type: "object"
    description: "추론 설정. 생략한 항목은 기본값을 쓴다."
    properties:
      conf:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.25
        description: "이 confidence 이상인 박스만 라벨로 남김"
      iou:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.7
        description: "NMS IoU 임계값"
      max_det:
        type: "integer"
        minimum: 1
        default: 300
        description: "이미지당 최대 박스 수"
  LabelingCreate:
    type: "object"
    required:
    - "model_id"
    - "source_path"
    properties:
      model_id:
        type: "string"
        description: "라벨링에 사용할 모델 (승인된 모델)"
        example: "mdl_01HZY2C4"
      source_path:
        type: "string"
        description: "라벨링할 원천 데이터 위치"
        example: "/data/raw/2026-10"
      params:
        $ref: "#/definitions/LabelingParams"
      idempotency_key:
        type: "string"
        maxLength: 128
        description: "같은 키로 다시 요청하면 새로 만들지 않고 기존 라벨링을 돌려줌"
  LabelingSummary:
    type: "object"
    description: "라벨링 결과 요약. 데이터셋을 만들 때 `min_confidence`를 고르는 근거로 쓴다."
    properties:
      output_path:
        type: "string"
        example: "/data/labeling_outputs/lbl_01HZW9P3/labels.jsonl"
      num_images:
        type: "integer"
        example: 5000
      num_images_without_labels:
        type: "integer"
        example: 312
      num_unreadable_images:
        type: "integer"
        example: 3
      num_labels:
        type: "integer"
        example: 18240
      class_counts:
        type: "object"
        description: "클래스별 라벨 수"
        additionalProperties:
          type: "integer"
        example:
          person: 12011
          car: 6229
      confidence_histogram:
        type: "object"
        description: "confidence 0.1 단위 구간별 라벨 수"
        additionalProperties:
          type: "integer"
        example:
          "0.2-0.3": 1630
          "0.9-1.0": 9050
  Labeling:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "labeling_id"
      - "model_id"
      - "source_path"
      - "status"
      properties:
        labeling_id:
          type: "string"
          readOnly: true
          example: "lbl_01HZW9P3"
        model_id:
          type: "string"
          example: "mdl_01HZY2C4"
        source_path:
          type: "string"
          example: "/data/raw/2026-10"
        params:
          $ref: "#/definitions/LabelingParams"
        status:
          $ref: "#/definitions/JobStatus"
        progress:
          $ref: "#/definitions/Progress"
        summary:
          $ref: "#/definitions/LabelingSummary"
        error:
          type: "string"
          description: "실패 원인. `failed`일 때만 있음"

  # ------------------------------------------------------------------ datasets
  Split:
    type: "object"
    description: "학습/검증 분할 비율. 합이 1이어야 한다."
    properties:
      train:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.8
      val:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.2
  DatasetCreate:
    type: "object"
    required:
    - "labeling_id"
    - "min_confidence"
    properties:
      labeling_id:
        type: "string"
        description: "데이터셋을 만들 라벨링 결과 (succeeded 상태여야 함)"
        example: "lbl_01HZW9P3"
      min_confidence:
        type: "number"
        minimum: 0
        maximum: 1
        description: "이 값 이상인 라벨만 사용"
        example: 0.9
      split:
        $ref: "#/definitions/Split"
      base_dataset_id:
        type: "string"
        description: "이 데이터셋에 더해서 만들 때만 지정"
        example: "ds_01HZX1A2"
  Dataset:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "dataset_id"
      - "labeling_id"
      - "status"
      properties:
        dataset_id:
          type: "string"
          readOnly: true
          example: "ds_01HZX1A2"
        labeling_id:
          type: "string"
          description: "출처 라벨링"
          example: "lbl_01HZW9P3"
        model_id:
          type: "string"
          description: "출처 라벨링에 쓰인 모델"
          example: "mdl_01HZY2C4"
        base_dataset_id:
          type: "string"
        min_confidence:
          type: "number"
          example: 0.9
        split:
          $ref: "#/definitions/Split"
        status:
          $ref: "#/definitions/JobStatus"
        num_samples:
          type: "object"
          description: "분할별 이미지 수"
          properties:
            train:
              type: "integer"
              example: 3800
            val:
              type: "integer"
              example: 950
        num_excluded_labels:
          type: "integer"
          description: "신뢰도 기준 미만이라 제외된 라벨 수"
          example: 2410
        class_counts:
          type: "object"
          additionalProperties:
            type: "integer"
        error:
          type: "string"

  # ------------------------------------------------------------------ trainings
  TrainingConfig:
    type: "object"
    required:
    - "model_arch"
    - "epochs"
    properties:
      model_arch:
        type: "string"
        description: "모델 구조"
        example: "yolo11m"
      epochs:
        type: "integer"
        minimum: 1
        description: "학습 반복 횟수"
        example: 100
      batch_size:
        type: "integer"
        minimum: 1
        default: 16
      learning_rate:
        type: "number"
        default: 0.001
  TrainingResources:
    type: "object"
    properties:
      gpu_count:
        type: "integer"
        minimum: 1
        default: 1
        description: "사용할 GPU 수"
  TrainingCreate:
    type: "object"
    required:
    - "dataset_id"
    - "config"
    properties:
      dataset_id:
        type: "string"
        description: "학습에 사용할 데이터셋"
        example: "ds_01HZX1A2"
      base_model_id:
        type: "string"
        description: "이어서 학습할 모델. 없으면 처음부터 학습"
        example: "mdl_01HZY2C4"
      config:
        $ref: "#/definitions/TrainingConfig"
      resources:
        $ref: "#/definitions/TrainingResources"
      idempotency_key:
        type: "string"
        maxLength: 128
  Training:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "training_id"
      - "dataset_id"
      - "status"
      properties:
        training_id:
          type: "string"
          readOnly: true
          example: "trn_01HZX3K9"
        dataset_id:
          type: "string"
          example: "ds_01HZX1A2"
        base_model_id:
          type: "string"
        config:
          $ref: "#/definitions/TrainingConfig"
        resources:
          $ref: "#/definitions/TrainingResources"
        status:
          $ref: "#/definitions/JobStatus"
        progress:
          $ref: "#/definitions/Progress"
        error:
          type: "string"
  MetricPoint:
    type: "object"
    properties:
      step:
        type: "integer"
        example: 1200
      epoch:
        type: "integer"
        example: 12
      name:
        type: "string"
        example: "val/mAP50"
      value:
        type: "number"
        example: 0.713
      recorded_at:
        type: "string"
        format: "date-time"
  TrainingResult:
    type: "object"
    properties:
      training_id:
        type: "string"
        example: "trn_01HZX3K9"
      metrics:
        type: "object"
        description: "최종 평가 지표"
        additionalProperties:
          type: "number"
        example:
          mAP50: 0.742
          mAP50-95: 0.531
          precision: 0.801
          recall: 0.688
      weights_path:
        type: "string"
        example: "/data/trainings/trn_01HZX3K9/weights/best.pt"

  # ------------------------------------------------------------------ models
  ModelStatus:
    type: "string"
    enum:
    - "pending"
    - "approved"
    description: "pending = 승인대기, approved = 승인"
  ModelCreate:
    type: "object"
    required:
    - "training_id"
    properties:
      training_id:
        type: "string"
        description: "모델로 등록할 학습 (succeeded 상태여야 함)"
        example: "trn_01HZX3K9"
      description:
        type: "string"
        example: "3회차 학습 결과"
  ModelApprove:
    type: "object"
    required:
    - "approved_by"
    properties:
      approved_by:
        type: "string"
        description: "승인자"
        example: "hong.gildong"
      comment:
        type: "string"
        description: "승인 사유"
        example: "이전 모델 대비 mAP 3% 향상"
  Model:
    type: "object"
    required:
    - "model_id"
    - "training_id"
    - "status"
    - "created_at"
    properties:
      model_id:
        type: "string"
        readOnly: true
        example: "mdl_01HZY2C4"
      version:
        type: "integer"
        readOnly: true
        example: 3
      training_id:
        type: "string"
        description: "출처 학습"
        example: "trn_01HZX3K9"
      dataset_id:
        type: "string"
        description: "출처 데이터셋"
        example: "ds_01HZX1A2"
      description:
        type: "string"
      metrics:
        type: "object"
        additionalProperties:
          type: "number"
      status:
        $ref: "#/definitions/ModelStatus"
      approved_by:
        type: "string"
      approved_at:
        type: "string"
        format: "date-time"
      comment:
        type: "string"
      created_at:
        type: "string"
        format: "date-time"
        readOnly: true

  # ------------------------------------------------------------------ webhooks
  EventType:
    type: "string"
    enum:
    - "labeling.succeeded"
    - "labeling.failed"
    - "dataset.ready"
    - "training.succeeded"
    - "training.failed"
    - "model.approved"
  WebhookCreate:
    type: "object"
    required:
    - "url"
    - "events"
    properties:
      url:
        type: "string"
        description: "이벤트를 받을 주소"
        example: "https://orchestrator.internal/hooks"
      events:
        type: "array"
        minItems: 1
        items:
          $ref: "#/definitions/EventType"
        example:
        - "dataset.ready"
        - "training.succeeded"
      description:
        type: "string"
        example: "파이프라인 오케스트레이터"
  WebhookUpdate:
    type: "object"
    description: "바꿀 항목만 보낸다."
    properties:
      url:
        type: "string"
        example: "https://orchestrator.internal/hooks/v2"
      events:
        type: "array"
        minItems: 1
        items:
          $ref: "#/definitions/EventType"
      description:
        type: "string"
  Webhook:
    type: "object"
    required:
    - "webhook_id"
    - "url"
    - "events"
    properties:
      webhook_id:
        type: "string"
        readOnly: true
        example: "whk_01HZZ0A1"
      url:
        type: "string"
        example: "https://orchestrator.internal/hooks"
      events:
        type: "array"
        items:
          $ref: "#/definitions/EventType"
      description:
        type: "string"
      created_at:
        type: "string"
        format: "date-time"
        readOnly: true
  WebhookCreated:
    type: "object"
    allOf:
    - $ref: "#/definitions/Webhook"
    - type: "object"
      required:
      - "secret"
      properties:
        secret:
          type: "string"
          readOnly: true
          description: "서명 확인용 비밀키. 등록할 때 한 번만 보여준다."
          example: "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"

  # ------------------------------------------------------------------ 이벤트 본문
  Event:
    type: "object"
    description: "Webhook으로 전송되는 이벤트 본문 (CloudEvents 형식). `data`는 이벤트 종류별 정의를 따른다."
    required:
    - "id"
    - "type"
    - "source"
    - "time"
    - "data"
    properties:
      id:
        type: "string"
        description: "이벤트 고유 ID. 중복 제거 기준"
        example: "evt_01HZY7QW"
      type:
        $ref: "#/definitions/EventType"
      source:
        type: "string"
        description: "이벤트가 발생한 리소스"
        example: "/v1/trainings/trn_01HZX3K9"
      time:
        type: "string"
        format: "date-time"
        example: "2026-10-27T18:20:00+09:00"
      data:
        type: "object"
        description: "LabelingEventData, DatasetEventData, TrainingEventData, ModelEventData 중 하나"
  LabelingEventData:
    type: "object"
    properties:
      labeling_id:
        type: "string"
      model_id:
        type: "string"
      summary:
        $ref: "#/definitions/LabelingSummary"
      error:
        $ref: "#/definitions/Problem"
  DatasetEventData:
    type: "object"
    properties:
      dataset_id:
        type: "string"
      labeling_id:
        type: "string"
  TrainingEventData:
    type: "object"
    properties:
      training_id:
        type: "string"
      dataset_id:
        type: "string"
      error:
        $ref: "#/definitions/Problem"
  ModelEventData:
    type: "object"
    properties:
      model_id:
        type: "string"
      training_id:
        type: "string"
      approved_by:
        type: "string"
