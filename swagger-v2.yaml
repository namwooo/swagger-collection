---
swagger: "2.0"
info:
  title: "MRX API"
  version: "0.1.0"
  description: |
    마키나락스 비전 OPs API.
basePath: "/v1"
schemes:
- "http"
consumes:
- "application/json"
produces:
- "application/json"
tags:
- name: "new-models"
  description: "초도 모델 학습"
- name: "labelings"
  description: "자동 라벨링과 리뷰"
- name: "datasets"
  description: "학습용 데이터셋 구성"
- name: "trainings"
  description: "학습 실행과 모니터링"
- name: "models"
  description: "모델 등록 · 적용 · 추출"

paths:
  # ------------------------------------------------------------------ new-models
  /new-models:
    post:
      tags:
      - "new-models"
      summary: "초도 모델 학습"
      description: |
        학습된 모델이 없는 상태에서, 사람이 라벨링한 이미지와 라벨로 첫 모델을 학습한다.
        학습 가능한 기존 모델이 있으면 이 API 대신 `/registry/models`에 등록된 모델을 쓸 수 있다.
        학습이 끝난 모델은 `POST /registry/models`에 `type: init`으로 등록한다.
      operationId: "createNewModel"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/NewModelCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/NewModel"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "`image_path` · `label_path` 또는 `model_id`가 없음"
          schema:
            $ref: "#/definitions/Problem"
  /new-models/{new_model_id}:
    get:
      tags:
      - "new-models"
      summary: "초도 모델 학습 상태 조회"
      operationId: "getNewModel"
      parameters:
      - $ref: "#/parameters/new_model_id"
      responses:
        "200":
          description: "초도 모델 학습"
          schema:
            $ref: "#/definitions/NewModel"
        "404":
          $ref: "#/responses/NotFound"

  # ------------------------------------------------------------------ labelings
  /labelings:
    post:
      tags:
      - "labelings"
      summary: "자동 라벨링 실행"
      description: "원천 데이터에 자동 라벨링을 시작한다. `model_id`를 생략하면 현재 적용된 모델(`POST /registry/models/{model_id}/apply`)을 쓴다."
      operationId: "createLabeling"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/LabelingCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/Labeling"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "`model_id`가 없거나, 생략했는데 적용된 모델이 없음"
          schema:
            $ref: "#/definitions/Problem"
    get:
      tags:
      - "labelings"
      summary: "라벨링 목록 조회"
      description: "최근에 등록한 것부터 보여준다."
      operationId: "listLabelings"
      parameters:
      - $ref: "#/parameters/status"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "라벨링 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Labeling"
  /labelings/{labeling_id}:
    get:
      tags:
      - "labelings"
      summary: "라벨링 작업 상태 조회"
      description: "진행률, 상태, 결과 요약을 조회한다."
      operationId: "getLabeling"
      parameters:
      - $ref: "#/parameters/labeling_id"
      responses:
        "200":
          description: "라벨링"
          schema:
            $ref: "#/definitions/Labeling"
        "404":
          $ref: "#/responses/NotFound"
  /labelings/{labeling_id}/images:
    get:
      tags:
      - "labelings"
      summary: "라벨링 이미지 목록 조회"
      description: "라벨링 대상 이미지 목록과 이미지별 라벨 수, 리뷰 여부를 조회한다."
      operationId: "listLabelingImages"
      parameters:
      - $ref: "#/parameters/labeling_id"
      - name: "reviewed"
        in: "query"
        description: "true면 리뷰한 이미지만, false면 리뷰 안 한 이미지만"
        required: false
        type: "boolean"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "이미지 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/LabelingImage"
        "404":
          $ref: "#/responses/NotFound"
  /labelings/{labeling_id}/result:
    get:
      tags:
      - "labelings"
      summary: "라벨링 결과 조회"
      description: "이미지별 자동 라벨링 결과를 조회한다. 라벨링이 끝나기 전에는 처리된 이미지까지만 나온다."
      operationId: "listLabelingResults"
      parameters:
      - $ref: "#/parameters/labeling_id"
      - name: "min_confidence"
        in: "query"
        description: "이 confidence 이상인 라벨만 포함"
        required: false
        type: "number"
        minimum: 0
        maximum: 1
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "이미지별 라벨링 결과"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ImageLabelResult"
        "404":
          $ref: "#/responses/NotFound"
  /labelings/{labeling_id}/result/{image_id}:
    get:
      tags:
      - "labelings"
      summary: "라벨링 결과 개별 조회"
      description: "이미지 한 장의 자동 라벨링 결과와 리뷰 결과를 함께 조회한다."
      operationId: "getLabelingResult"
      parameters:
      - $ref: "#/parameters/labeling_id"
      - $ref: "#/parameters/image_id"
      responses:
        "200":
          description: "이미지 한 장의 라벨링 결과"
          schema:
            $ref: "#/definitions/ImageLabelResult"
        "404":
          $ref: "#/responses/NotFound"
  /labelings/{labeling_id}/reviewed:
    post:
      tags:
      - "labelings"
      summary: "리뷰 라벨링 결과 생성"
      description: |
        사람이 검토한 라벨링 결과를 저장한다. 이미 리뷰 결과가 있는 이미지가 포함되면 409로 거절한다.
        이미 있는 결과를 고칠 때는 `PUT`을 쓴다.
      operationId: "createReviewedLabels"
      parameters:
      - $ref: "#/parameters/labeling_id"
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/ReviewedLabelsRequest"
      responses:
        "201":
          description: "저장됨"
          schema:
            $ref: "#/definitions/ReviewedLabelsResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "라벨링이 없거나, 이 라벨링에 없는 `image_id`가 포함됨"
          schema:
            $ref: "#/definitions/Problem"
        "409":
          description: "라벨링이 끝나지 않았거나, 이미 리뷰 결과가 있는 이미지가 포함됨"
          schema:
            $ref: "#/definitions/Problem"
    put:
      tags:
      - "labelings"
      summary: "리뷰 라벨링 결과 벌크 업데이트"
      description: "보낸 이미지들의 리뷰 결과를 통째로 바꾼다. 보내지 않은 이미지는 그대로 둔다."
      operationId: "updateReviewedLabels"
      parameters:
      - $ref: "#/parameters/labeling_id"
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/ReviewedLabelsRequest"
      responses:
        "200":
          description: "변경됨"
          schema:
            $ref: "#/definitions/ReviewedLabelsResponse"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "라벨링이 없거나, 이 라벨링에 없는 `image_id`가 포함됨"
          schema:
            $ref: "#/definitions/Problem"

  # ------------------------------------------------------------------ datasets
  /datasets:
    post:
      tags:
      - "datasets"
      summary: "데이터셋 생성"
      description: "라벨링 결과로 데이터셋을 구성한다. 한 번 만든 데이터셋은 수정하지 않는다."
      operationId: "createDataset"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/DatasetCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/Dataset"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "지정한 라벨링 또는 기준 데이터셋이 없음"
          schema:
            $ref: "#/definitions/Problem"
        "409":
          description: "라벨링이 아직 끝나지 않음"
          schema:
            $ref: "#/definitions/Problem"
    get:
      tags:
      - "datasets"
      summary: "데이터셋 목록 조회"
      description: "메타데이터(모델, 라인, 태스크)와 상태로 거를 수 있다."
      operationId: "listDatasets"
      parameters:
      - name: "model_id"
        in: "query"
        description: "이 모델용 데이터셋만"
        required: false
        type: "string"
      - name: "line"
        in: "query"
        description: "이 라인의 데이터셋만"
        required: false
        type: "string"
      - name: "task"
        in: "query"
        description: "이 태스크의 데이터셋만"
        required: false
        type: "string"
      - $ref: "#/parameters/status"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "데이터셋 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Dataset"
  /datasets/{dataset_id}:
    get:
      tags:
      - "datasets"
      summary: "데이터셋 상세 조회"
      description: "메타데이터, 분할별 이미지 수, 클래스 분포, 출처 라벨링을 조회한다."
      operationId: "getDataset"
      parameters:
      - $ref: "#/parameters/dataset_id"
      responses:
        "200":
          description: "데이터셋"
          schema:
            $ref: "#/definitions/Dataset"
        "404":
          $ref: "#/responses/NotFound"

  # ------------------------------------------------------------------ trainings
  /trainings:
    post:
      tags:
      - "trainings"
      summary: "학습 실행"
      description: "데이터셋으로 학습을 시작한다. 학습이 끝나면 `POST /registry/models`에 `type: line`으로 등록한다."
      operationId: "createTraining"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/TrainingCreate"
      responses:
        "202":
          description: "접수됨. 상태는 `queued`."
          schema:
            $ref: "#/definitions/Training"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "데이터셋 또는 기준 모델이 없음"
          schema:
            $ref: "#/definitions/Problem"
        "409":
          description: "데이터셋 구성이 끝나지 않음"
          schema:
            $ref: "#/definitions/Problem"
    get:
      tags:
      - "trainings"
      summary: "학습 목록 조회"
      operationId: "listTrainings"
      parameters:
      - name: "dataset_id"
        in: "query"
        description: "이 데이터셋으로 실행한 학습만"
        required: false
        type: "string"
      - $ref: "#/parameters/status"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "학습 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Training"
  /trainings/{training_id}:
    get:
      tags:
      - "trainings"
      summary: "학습 상태 조회"
      description: "진행률과 상태를 조회한다."
      operationId: "getTraining"
      parameters:
      - $ref: "#/parameters/training_id"
      responses:
        "200":
          description: "학습"
          schema:
            $ref: "#/definitions/Training"
        "404":
          $ref: "#/responses/NotFound"
  /trainings/{training_id}/metrics:
    get:
      tags:
      - "trainings"
      summary: "학습 지표 조회"
      description: "epoch별 지표 이력을 조회한다. 진행 중에도 조회할 수 있다."
      operationId: "listTrainingMetrics"
      parameters:
      - $ref: "#/parameters/training_id"
      - name: "since_step"
        in: "query"
        description: "이 step 이후의 지표만 조회"
        required: false
        type: "integer"
        minimum: 0
      responses:
        "200":
          description: "지표 이력"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/MetricPoint"
        "404":
          $ref: "#/responses/NotFound"
  /trainings/{training_id}/result:
    get:
      tags:
      - "trainings"
      summary: "학습 결과 조회"
      description: "학습 종료 후 최종 평가 결과를 조회한다."
      operationId: "getTrainingResult"
      parameters:
      - $ref: "#/parameters/training_id"
      responses:
        "200":
          description: "최종 평가 결과"
          schema:
            $ref: "#/definitions/TrainingResult"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          description: "학습이 아직 끝나지 않음"
          schema:
            $ref: "#/definitions/Problem"
  /trainings/{training_id}/logs:
    get:
      tags:
      - "trainings"
      summary: "학습 로그 조회"
      description: "학습 로그를 조회한다. `follow=true`면 연결을 유지하며 새 로그를 이어서 보낸다."
      operationId: "getTrainingLogs"
      produces:
      - "text/plain"
      parameters:
      - $ref: "#/parameters/training_id"
      - name: "tail"
        in: "query"
        description: "마지막 N줄만 조회"
        required: false
        type: "integer"
        minimum: 1
      - name: "follow"
        in: "query"
        description: "새 로그를 계속 이어서 받을지 여부"
        required: false
        type: "boolean"
        default: false
      responses:
        "200":
          description: "로그 (한 줄에 한 항목)"
          schema:
            type: "string"
        "404":
          $ref: "#/responses/NotFound"
  /trainings/{training_id}/cancel:
    post:
      tags:
      - "trainings"
      summary: "학습 중단"
      description: "대기 중이거나 진행 중인 학습을 중단하고 GPU를 반환한다."
      operationId: "cancelTraining"
      parameters:
      - $ref: "#/parameters/training_id"
      responses:
        "200":
          description: "중단됨. 상태는 `canceled`."
          schema:
            $ref: "#/definitions/Training"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/AlreadyFinished"

  # ------------------------------------------------------------------ models
  /registry/models:
    post:
      tags:
      - "models"
      summary: "모델 등록"
      description: |
        학습이 끝난 모델을 Registry에 등록한다. `type`으로 공정 모델과 초도 모델을 구분한다.
        - `line`: 공정 모델. `training_id` 필수
        - `init`: 초도 모델. `new_model_id` 필수
      operationId: "createModel"
      parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/ModelCreate"
      responses:
        "201":
          description: "등록됨"
          schema:
            $ref: "#/definitions/Model"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          description: "지정한 학습 또는 초도 모델 학습이 없음"
          schema:
            $ref: "#/definitions/Problem"
        "409":
          description: "학습이 성공하지 않았거나, 같은 `model_name` · `model_version`이 이미 있음"
          schema:
            $ref: "#/definitions/Problem"
    get:
      tags:
      - "models"
      summary: "모델 목록 조회"
      operationId: "listModels"
      parameters:
      - name: "type"
        in: "query"
        description: "모델 종류"
        required: false
        type: "string"
        enum:
        - "line"
        - "init"
      - name: "model_name"
        in: "query"
        required: false
        type: "string"
      - name: "line"
        in: "query"
        required: false
        type: "string"
      - name: "task"
        in: "query"
        required: false
        type: "string"
      - name: "applied"
        in: "query"
        description: "true면 현재 적용된 모델만"
        required: false
        type: "boolean"
      - $ref: "#/parameters/limit"
      - $ref: "#/parameters/offset"
      responses:
        "200":
          description: "모델 목록"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Model"
  /registry/models/{model_id}:
    get:
      tags:
      - "models"
      summary: "모델 상세 조회"
      description: "메타데이터, 출처 학습, 평가 지표, 적용 여부, 추출 이력을 조회한다."
      operationId: "getModel"
      parameters:
      - $ref: "#/parameters/model_id"
      responses:
        "200":
          description: "모델"
          schema:
            $ref: "#/definitions/Model"
        "404":
          $ref: "#/responses/NotFound"
  /registry/models/{model_id}/apply:
    post:
      tags:
      - "models"
      summary: "모델 적용"
      description: |
        모델을 해당 라인 · 태스크의 현재 모델로 적용한다. 같은 라인 · 태스크에 적용돼 있던 모델은 해제된다.
        적용된 모델은 `model_id`를 생략한 자동 라벨링에 쓰인다.
      operationId: "applyModel"
      parameters:
      - $ref: "#/parameters/model_id"
      - in: "body"
        name: "body"
        required: false
        schema:
          $ref: "#/definitions/ModelApply"
      responses:
        "200":
          description: "적용됨"
          schema:
            $ref: "#/definitions/Model"
        "404":
          $ref: "#/responses/NotFound"
  /registry/models/{model_id}/export:
    post:
      tags:
      - "models"
      summary: "모델 추출"
      description: |
        모델을 지정한 형식으로 변환해 파일로 내보낸다. 변환에 시간이 걸릴 수 있어 비동기로 처리한다.
        진행 상태와 파일 경로는 모델 상세 조회의 `exports`에서 확인한다.
      operationId: "exportModel"
      parameters:
      - $ref: "#/parameters/model_id"
      - in: "body"
        name: "body"
        required: true
        schema:
          $ref: "#/definitions/ModelExportRequest"
      responses:
        "202":
          description: "접수됨"
          schema:
            $ref: "#/definitions/ModelExport"
        "400":
          $ref: "#/responses/BadRequest"
        "404":
          $ref: "#/responses/NotFound"

parameters:
  new_model_id:
    name: "new_model_id"
    in: "path"
    required: true
    type: "string"
    description: "초도 모델 학습 ID"
  labeling_id:
    name: "labeling_id"
    in: "path"
    required: true
    type: "string"
    description: "라벨링 ID"
  image_id:
    name: "image_id"
    in: "path"
    required: true
    type: "string"
    description: "이미지 ID"
  dataset_id:
    name: "dataset_id"
    in: "path"
    required: true
    type: "string"
    description: "데이터셋 ID"
  training_id:
    name: "training_id"
    in: "path"
    required: true
    type: "string"
    description: "학습 ID"
  model_id:
    name: "model_id"
    in: "path"
    required: true
    type: "string"
    description: "모델 ID"
  status:
    name: "status"
    in: "query"
    required: false
    type: "array"
    items:
      type: "string"
      enum:
      - "queued"
      - "running"
      - "succeeded"
      - "failed"
      - "canceled"
    collectionFormat: "multi"
    description: "이 상태인 것만 조회. 여러 개 줄 수 있음 (`?status=queued&status=running`)"
  limit:
    name: "limit"
    in: "query"
    required: false
    type: "integer"
    minimum: 1
    maximum: 500
    default: 50
    description: "한 번에 받을 개수"
  offset:
    name: "offset"
    in: "query"
    required: false
    type: "integer"
    minimum: 0
    default: 0
    description: "건너뛸 개수"

responses:
  BadRequest:
    description: "요청 형식 오류"
    schema:
      $ref: "#/definitions/Problem"
    examples:
      application/json:
        type: "https://mrx.internal/problems/invalid-request"
        title: "요청 형식 오류"
        status: 400
        detail: "source_path: field required"
  NotFound:
    description: "리소스가 없음"
    schema:
      $ref: "#/definitions/Problem"
    examples:
      application/json:
        type: "https://mrx.internal/problems/not-found"
        title: "리소스가 없음"
        status: 404
        detail: "labeling 'lbl_01HZW9P3' not found"
  AlreadyFinished:
    description: "이미 끝난 작업이라 중단할 수 없음"
    schema:
      $ref: "#/definitions/Problem"
    examples:
      application/json:
        type: "https://mrx.internal/problems/conflict"
        title: "이미 끝난 작업"
        status: 409
        detail: "training 'trn_01HZX3K9' is already succeeded"

definitions:
  # ------------------------------------------------------------------ 공통
  JobStatus:
    type: "string"
    description: "비동기 작업 상태"
    enum:
    - "queued"
    - "running"
    - "succeeded"
    - "failed"
    - "canceled"
  Progress:
    type: "object"
    properties:
      done:
        type: "integer"
        description: "처리한 수 (라벨링·데이터셋은 이미지 수, 학습은 epoch 수)"
        example: 1200
      total:
        type: "integer"
        description: "전체 수"
        example: 5000
      percent:
        type: "number"
        example: 24.0
  JobTimes:
    type: "object"
    required:
    - "created_at"
    properties:
      created_at:
        type: "string"
        format: "date-time"
        readOnly: true
      started_at:
        type: "string"
        format: "date-time"
        readOnly: true
        description: "실행 시작 시각. 시작 전에는 없음"
      finished_at:
        type: "string"
        format: "date-time"
        readOnly: true
        description: "종료 시각. 종료 전에는 없음"
  Problem:
    type: "object"
    description: "RFC 9457 Problem Details"
    properties:
      type:
        type: "string"
        example: "https://mrx.internal/problems/{code}"
      title:
        type: "string"
        example: "에러 종류"
      status:
        type: "integer"
        example: 409
      detail:
        type: "string"
        example: "사람이 읽을 수 있는 상세 설명"
      instance:
        type: "string"
        example: "/v1/..."
  ClassInfo:
    type: "object"
    required:
    - "class_id"
    - "class_name"
    properties:
      class_id:
        type: "integer"
        minimum: 0
        example: 0
      class_name:
        type: "string"
        example: "scratch"
  TrainParams:
    type: "object"
    description: "학습 설정. 생략한 항목은 기본값을 쓴다."
    properties:
      model_arch:
        type: "string"
        description: "모델 구조. 기준 모델이 있으면 기준 모델의 구조를 쓴다"
        example: "yolo11m"
      epochs:
        type: "integer"
        minimum: 1
        default: 100
      batch_size:
        type: "integer"
        minimum: 1
        default: 16
      learning_rate:
        type: "number"
        default: 0.001
      image_size:
        type: "integer"
        minimum: 32
        default: 640

  # ------------------------------------------------------------------ new-models
  NewModelParams:
    type: "object"
    description: "초도 학습 설정. 클래스 정보와 학습 설정을 담는다. 생략한 항목은 기본값을 쓴다."
    allOf:
    - $ref: "#/definitions/TrainParams"
    - type: "object"
      properties:
        classes:
          type: "array"
          description: "클래스 정의. 생략하면 `label_path`의 라벨에서 읽는다"
          items:
            $ref: "#/definitions/ClassInfo"
  NewModelCreate:
    type: "object"
    required:
    - "image_path"
    - "label_path"
    properties:
      model_id:
        type: "string"
        description: "초도 학습을 시작할 기반 모델 (예: 사전학습 모델). 생략하면 기본 사전학습 모델을 쓴다"
        example: "pretrained-yolo11m"
      image_path:
        type: "string"
        description: "학습 이미지 위치"
        example: "/data/init/LINE3/images"
      label_path:
        type: "string"
        description: "사람이 라벨링한 라벨 위치 (YOLO 형식)"
        example: "/data/init/LINE3/labels"
      params:
        $ref: "#/definitions/NewModelParams"
  NewModel:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "new_model_id"
      - "image_path"
      - "label_path"
      - "status"
      properties:
        new_model_id:
          type: "string"
          readOnly: true
          example: "nm_01HZV8K2"
        model_id:
          type: "string"
          example: "pretrained-yolo11m"
        image_path:
          type: "string"
          example: "/data/init/LINE3/images"
        label_path:
          type: "string"
          example: "/data/init/LINE3/labels"
        params:
          $ref: "#/definitions/NewModelParams"
        status:
          $ref: "#/definitions/JobStatus"
        progress:
          $ref: "#/definitions/Progress"
        metrics:
          type: "object"
          description: "최종 평가 지표. `succeeded`일 때만 있음"
          additionalProperties:
            type: "number"
          example:
            mAP50: 0.702
            precision: 0.781
            recall: 0.655
        weights_path:
          type: "string"
          description: "학습된 가중치 위치. `succeeded`일 때만 있음"
          example: "/data/new_models/nm_01HZV8K2/weights/best.pt"
        error:
          type: "string"
          description: "실패 원인. `failed`일 때만 있음"

  # ------------------------------------------------------------------ labelings
  LabelingParams:
    type: "object"
    description: "추론 설정. 생략한 항목은 기본값을 쓴다."
    properties:
      conf:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.25
        description: "이 confidence 이상인 박스만 라벨로 남김"
      iou:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.7
        description: "NMS IoU 임계값"
      max_det:
        type: "integer"
        minimum: 1
        default: 300
        description: "이미지당 최대 박스 수"
  LabelingCreate:
    type: "object"
    required:
    - "source_path"
    properties:
      model_id:
        type: "string"
        description: "라벨링에 쓸 모델. 생략하면 현재 적용된 모델"
        example: "mdl_01HZY2C4"
      source_path:
        type: "string"
        description: "라벨링할 원천 데이터 위치"
        example: "/data/raw/2026-10"
      params:
        $ref: "#/definitions/LabelingParams"
      idempotency_key:
        type: "string"
        maxLength: 128
        description: "같은 키로 다시 요청하면 새로 만들지 않고 기존 라벨링을 돌려줌"
  LabelingSummary:
    type: "object"
    description: "라벨링 결과 요약"
    properties:
      num_images:
        type: "integer"
        example: 5000
      num_images_without_labels:
        type: "integer"
        example: 312
      num_unreadable_images:
        type: "integer"
        example: 3
      num_labels:
        type: "integer"
        example: 18240
      num_reviewed_images:
        type: "integer"
        description: "리뷰 결과가 있는 이미지 수"
        example: 1200
      class_counts:
        type: "object"
        description: "클래스별 라벨 수"
        additionalProperties:
          type: "integer"
        example:
          scratch: 12011
          dent: 6229
      confidence_histogram:
        type: "object"
        description: "confidence 0.1 단위 구간별 라벨 수"
        additionalProperties:
          type: "integer"
        example:
          "0.2-0.3": 1630
          "0.9-1.0": 9050
  Labeling:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "labeling_id"
      - "model_id"
      - "source_path"
      - "status"
      properties:
        labeling_id:
          type: "string"
          readOnly: true
          example: "lbl_01HZW9P3"
        model_id:
          type: "string"
          description: "실제로 쓴 모델 (생략했으면 그때 적용돼 있던 모델)"
          example: "mdl_01HZY2C4"
        source_path:
          type: "string"
          example: "/data/raw/2026-10"
        params:
          $ref: "#/definitions/LabelingParams"
        status:
          $ref: "#/definitions/JobStatus"
        progress:
          $ref: "#/definitions/Progress"
        summary:
          $ref: "#/definitions/LabelingSummary"
        error:
          type: "string"
          description: "실패 원인. `failed`일 때만 있음"
  LabelingImage:
    type: "object"
    required:
    - "image_id"
    - "image_path"
    properties:
      image_id:
        type: "string"
        example: "img_000123"
      image_path:
        type: "string"
        example: "/data/raw/2026-10/LINE3_CAM2_104512.png"
      width:
        type: "integer"
        example: 2048
      height:
        type: "integer"
        example: 1536
      num_labels:
        type: "integer"
        description: "자동 라벨 수"
        example: 3
      review_result:
        $ref: "#/definitions/ReviewResult"
  AutoLabel:
    type: "object"
    required:
    - "class_id"
    - "class_name"
    - "confidence"
    - "bbox_xyxy"
    properties:
      class_id:
        type: "integer"
        example: 0
      class_name:
        type: "string"
        example: "scratch"
      confidence:
        type: "number"
        minimum: 0
        maximum: 1
        example: 0.9312
      bbox_xyxy:
        type: "array"
        description: "픽셀 좌표 [x1, y1, x2, y2]"
        minItems: 4
        maxItems: 4
        items:
          type: "number"
        example: [120.5, 88.0, 240.25, 190.75]
      bbox_xywhn:
        type: "array"
        description: "정규화 좌표 [중심 x, 중심 y, 너비, 높이] (YOLO 형식)"
        minItems: 4
        maxItems: 4
        items:
          type: "number"
        example: [0.0882, 0.0912, 0.0586, 0.0668]
  ReviewedLabel:
    type: "object"
    required:
    - "class_id"
    - "bbox_xyxy"
    properties:
      class_id:
        type: "integer"
        example: 0
      class_name:
        type: "string"
        example: "scratch"
      bbox_xyxy:
        type: "array"
        description: "픽셀 좌표 [x1, y1, x2, y2]"
        minItems: 4
        maxItems: 4
        items:
          type: "number"
        example: [118.0, 86.5, 242.0, 192.0]
  ReviewResult:
    type: "string"
    description: "리뷰 결과. OK = 자동 라벨 그대로 사용, MODIFY = 고쳐서 사용, DISCARD = 사용 안 함. 리뷰 전이면 없음"
    enum:
    - "OK"
    - "MODIFY"
    - "DISCARD"
  ImageLabelResult:
    type: "object"
    required:
    - "image_id"
    - "image_path"
    - "labels"
    properties:
      image_id:
        type: "string"
        example: "img_000123"
      image_path:
        type: "string"
        example: "/data/raw/2026-10/LINE3_CAM2_104512.png"
      width:
        type: "integer"
        example: 2048
      height:
        type: "integer"
        example: 1536
      labels:
        type: "array"
        description: "자동 라벨. 결함이 없으면 빈 배열"
        items:
          $ref: "#/definitions/AutoLabel"
      review:
        $ref: "#/definitions/ImageReview"
  ImageReview:
    type: "object"
    description: "리뷰 결과. 리뷰 전이면 없음"
    required:
    - "result"
    properties:
      result:
        $ref: "#/definitions/ReviewResult"
      labels:
        type: "array"
        description: "최종 라벨. `OK`면 자동 라벨과 같고, `DISCARD`면 비어 있음"
        items:
          $ref: "#/definitions/ReviewedLabel"
      reviewed_by:
        type: "string"
        example: "hong.gildong"
      reviewed_at:
        type: "string"
        format: "date-time"
        readOnly: true
  ReviewedImage:
    type: "object"
    required:
    - "image_id"
    - "result"
    properties:
      image_id:
        type: "string"
        example: "img_000123"
      result:
        $ref: "#/definitions/ReviewResult"
      labels:
        type: "array"
        description: "`MODIFY`일 때 필수. `OK`면 생략(자동 라벨을 그대로 씀), `DISCARD`면 생략"
        items:
          $ref: "#/definitions/ReviewedLabel"
  ReviewedLabelsRequest:
    type: "object"
    required:
    - "items"
    properties:
      reviewed_by:
        type: "string"
        description: "리뷰한 사람"
        example: "hong.gildong"
      items:
        type: "array"
        minItems: 1
        maxItems: 1000
        description: "이미지별 리뷰 결과. 한 번에 최대 1,000장"
        items:
          $ref: "#/definitions/ReviewedImage"
    example:
      reviewed_by: "hong.gildong"
      items:
      - image_id: "img_000123"
        result: "OK"
      - image_id: "img_000124"
        result: "MODIFY"
        labels:
        - class_id: 0
          class_name: "scratch"
          bbox_xyxy: [118.0, 86.5, 242.0, 192.0]
        - class_id: 1
          class_name: "dent"
          bbox_xyxy: [900.0, 410.0, 1012.5, 488.0]
      - image_id: "img_000125"
        result: "DISCARD"
  ReviewedLabelsResponse:
    type: "object"
    properties:
      labeling_id:
        type: "string"
        example: "lbl_01HZW9P3"
      count:
        type: "integer"
        description: "저장하거나 바꾼 이미지 수"
        example: 250
      num_reviewed_images:
        type: "integer"
        description: "이 라벨링에서 리뷰 결과가 있는 전체 이미지 수"
        example: 1200

  # ------------------------------------------------------------------ datasets
  DatasetMetadata:
    type: "object"
    description: "데이터셋을 찾고 구분하는 정보. 목록 조회에서 이 값으로 거를 수 있다."
    required:
    - "model_id"
    - "line"
    - "task"
    properties:
      model_id:
        type: "string"
        description: "이 데이터셋으로 학습할 모델"
        example: "mdl_01HZY2C4"
      line:
        type: "string"
        description: "공정 라인"
        example: "LINE3"
      task:
        type: "string"
        description: "태스크"
        example: "detection"
  Split:
    type: "object"
    description: "학습 · 검증 · 시험 분할 비율. 합이 1이어야 한다."
    properties:
      train:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.7
      val:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.2
      test:
        type: "number"
        minimum: 0
        maximum: 1
        default: 0.1
  DatasetCreate:
    type: "object"
    required:
    - "labeling_ids"
    - "metadata"
    properties:
      labeling_ids:
        type: "array"
        minItems: 1
        description: "데이터셋을 만들 라벨링 결과 (succeeded 상태여야 함)"
        items:
          type: "string"
        example: ["lbl_01HZW9P3"]
      metadata:
        $ref: "#/definitions/DatasetMetadata"
      label_source:
        type: "string"
        enum:
        - "reviewed"
        - "auto"
        default: "reviewed"
        description: |
          어떤 라벨을 쓸지.
          - `reviewed`: 리뷰 결과만 사용. 리뷰 안 한 이미지와 `DISCARD` 이미지는 제외
          - `auto`: 자동 라벨 중 `min_confidence` 이상만 사용
      min_confidence:
        type: "number"
        minimum: 0
        maximum: 1
        description: "`label_source: auto`일 때 필수. 이 값 이상인 라벨만 사용"
        example: 0.9
      split:
        $ref: "#/definitions/Split"
      base_dataset_id:
        type: "string"
        description: "이 데이터셋에 더해서 만들 때만 지정. 시험(test) 분할은 기준 데이터셋 것을 그대로 쓴다"
        example: "ds_01HZX1A2"
  Dataset:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "dataset_id"
      - "metadata"
      - "status"
      properties:
        dataset_id:
          type: "string"
          readOnly: true
          example: "ds_01HZX1A2"
        metadata:
          $ref: "#/definitions/DatasetMetadata"
        labeling_ids:
          type: "array"
          description: "출처 라벨링"
          items:
            type: "string"
        label_source:
          type: "string"
          enum:
          - "reviewed"
          - "auto"
        min_confidence:
          type: "number"
        base_dataset_id:
          type: "string"
        split:
          $ref: "#/definitions/Split"
        status:
          $ref: "#/definitions/JobStatus"
        num_images:
          type: "object"
          description: "분할별 이미지 수"
          properties:
            train:
              type: "integer"
              example: 3500
            val:
              type: "integer"
              example: 1000
            test:
              type: "integer"
              example: 500
        class_counts:
          type: "object"
          additionalProperties:
            type: "integer"
          example:
            scratch: 8120
            dent: 3302
        storage_path:
          type: "string"
          description: "구성된 데이터셋 위치"
          example: "/data/datasets/ds_01HZX1A2"
        error:
          type: "string"

  # ------------------------------------------------------------------ trainings
  TrainingCreate:
    type: "object"
    required:
    - "dataset_id"
    properties:
      dataset_id:
        type: "string"
        description: "학습에 사용할 데이터셋"
        example: "ds_01HZX1A2"
      base_model_id:
        type: "string"
        description: "이어서 학습할 모델. 없으면 처음부터 학습"
        example: "mdl_01HZY2C4"
      params:
        $ref: "#/definitions/TrainParams"
      idempotency_key:
        type: "string"
        maxLength: 128
  Training:
    type: "object"
    allOf:
    - $ref: "#/definitions/JobTimes"
    - type: "object"
      required:
      - "training_id"
      - "dataset_id"
      - "status"
      properties:
        training_id:
          type: "string"
          readOnly: true
          example: "trn_01HZX3K9"
        dataset_id:
          type: "string"
          example: "ds_01HZX1A2"
        base_model_id:
          type: "string"
        params:
          $ref: "#/definitions/TrainParams"
        status:
          $ref: "#/definitions/JobStatus"
        progress:
          $ref: "#/definitions/Progress"
        error:
          type: "string"
  MetricPoint:
    type: "object"
    properties:
      step:
        type: "integer"
        example: 1200
      epoch:
        type: "integer"
        example: 12
      name:
        type: "string"
        example: "val/mAP50"
      value:
        type: "number"
        example: 0.713
      recorded_at:
        type: "string"
        format: "date-time"
  TrainingResult:
    type: "object"
    properties:
      training_id:
        type: "string"
        example: "trn_01HZX3K9"
      metrics:
        type: "object"
        description: "최종 평가 지표"
        additionalProperties:
          type: "number"
        example:
          mAP50: 0.742
          mAP50-95: 0.531
          precision: 0.801
          recall: 0.688
      weights_path:
        type: "string"
        example: "/data/trainings/trn_01HZX3K9/weights/best.pt"

  # ------------------------------------------------------------------ models
  ModelType:
    type: "string"
    description: "line = 공정 모델, init = 초도 모델"
    enum:
    - "line"
    - "init"
  ModelMetadata:
    type: "object"
    required:
    - "model_name"
    - "model_version"
    - "task"
    - "line"
    properties:
      model_name:
        type: "string"
        example: "defect-detector"
      model_version:
        type: "string"
        description: "같은 `model_name` 안에서 겹치면 안 됨"
        example: "1.4.0"
      task:
        type: "string"
        example: "detection"
      line:
        type: "string"
        example: "LINE3"
  ModelCreate:
    type: "object"
    required:
    - "type"
    - "metadata"
    properties:
      type:
        $ref: "#/definitions/ModelType"
      metadata:
        $ref: "#/definitions/ModelMetadata"
      training_id:
        type: "string"
        description: "`type: line`일 때 필수. 모델로 등록할 학습 (succeeded 상태여야 함)"
        example: "trn_01HZX3K9"
      new_model_id:
        type: "string"
        description: "`type: init`일 때 필수. 모델로 등록할 초도 모델 학습 (succeeded 상태여야 함)"
        example: "nm_01HZV8K2"
  ModelApply:
    type: "object"
    properties:
      applied_by:
        type: "string"
        description: "적용한 사람"
        example: "hong.gildong"
      comment:
        type: "string"
        description: "적용 사유"
        example: "이전 모델 대비 mAP 3% 향상"
  ModelExportRequest:
    type: "object"
    required:
    - "format"
    properties:
      format:
        type: "string"
        description: "내보낼 형식"
        enum:
        - "pt"
        - "onnx"
        - "torchscript"
        - "engine"
        example: "onnx"
  ModelExport:
    type: "object"
    properties:
      format:
        type: "string"
        example: "onnx"
      status:
        $ref: "#/definitions/JobStatus"
      file_path:
        type: "string"
        description: "추출된 파일 위치. `succeeded`일 때만 있음"
        example: "/data/registry/defect-detector/1.4.0/model.onnx"
      file_hash:
        type: "string"
        example: "sha256:9f2c1b0e4a7d3e58c6b1f0a2d9e4c7b8a1f3e5d7c9b2a4f6e8d0c2b4a6f8e0d2"
      requested_at:
        type: "string"
        format: "date-time"
      error:
        type: "string"
  Model:
    type: "object"
    required:
    - "model_id"
    - "type"
    - "metadata"
    - "created_at"
    properties:
      model_id:
        type: "string"
        readOnly: true
        example: "mdl_01HZY2C4"
      type:
        $ref: "#/definitions/ModelType"
      metadata:
        $ref: "#/definitions/ModelMetadata"
      training_id:
        type: "string"
        description: "출처 학습 (`type: line`)"
        example: "trn_01HZX3K9"
      new_model_id:
        type: "string"
        description: "출처 초도 모델 학습 (`type: init`)"
      dataset_id:
        type: "string"
        description: "출처 데이터셋"
        example: "ds_01HZX1A2"
      metrics:
        type: "object"
        additionalProperties:
          type: "number"
      weights_path:
        type: "string"
        example: "/data/registry/defect-detector/1.4.0/best.pt"
      applied:
        type: "boolean"
        description: "해당 라인 · 태스크에 현재 적용된 모델인지"
        example: true
      applied_by:
        type: "string"
      applied_at:
        type: "string"
        format: "date-time"
      exports:
        type: "array"
        description: "추출 이력"
        items:
          $ref: "#/definitions/ModelExport"
      created_at:
        type: "string"
        format: "date-time"
        readOnly: true